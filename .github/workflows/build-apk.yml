name: Generar APK de Produccion

# Controla cuándo se ejecutará el flujo de trabajo (de forma manual desde la pestaña Actions)
on:
  workflow_dispatch:

jobs:
  build:
    # Se ejecuta sobre la última versión estable de Ubuntu disponible en GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Trae el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configura el entorno de Java
      - name: Configurar JDK de Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          # Le indica a la caché que busque los archivos de Gradle dentro de la carpeta android
          cache-dependency-path: 'android/build.gradle' 

      # 3. Opcional: Da permisos de ejecución al wrapper de Gradle indicando la ruta correcta
      - name: Otorgar permisos a Gradle Wrapper
        run: chmod +x gradlew
        working-directory: android

      # 4. Ejecuta la compilación de tu APK dentro de la carpeta android
      - name: Compilar APK (Build APK)
        run: ./gradlew assembleRelease
        working-directory: android

      # 5. Sube el APK generado buscando en la ruta interna de la carpeta android
      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-Instalable
          path: android/app/build/outputs
