<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Social18 - Acceso Exclusivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: #1f2833;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #45f3ff20;
            text-align: center;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #45f3ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #ff4757;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .form-box {
            display: none;
        }

        .form-box.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #66fcf1;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0b0c10;
            border: 1px solid #45f3ff40;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #45f3ff;
            box-shadow: 0 0 8px rgba(69, 243, 255, 0.3);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #45f3ff, #ff4757);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .switch-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #c5c6c7;
        }

        .switch-text span {
            color: #45f3ff;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        .disclaimer {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #65676b;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1 class="brand-title">Social18</h1>
        <div class="brand-subtitle">ZONA EXCLUSIVA (18+)</div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <div id="login-box" class="form-box active">
            <div class="input-group">
                <label>CORREO ELECTRÓNICO</label>
                <input type="email" id="login-email" placeholder="tu@correo.com" required>
            </div>
            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>
            <button class="btn-action" onclick="window.location.href='index.html'">INGRESAR</button>
            <p class="switch-text">¿No tienes cuenta? <span onclick="toggleAuthMode()">Regístrate aquí</span></p>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div id="register-box" class="form-box">
            <div class="input-group">
                <label>NOMBRE DE USUARIO</label>
                <input type="text" id="reg-name" placeholder="Ej. Alex99">
            </div>
            <div class="input-group">
                <label>CORREO ELECTRÓNICO</label>
                <input type="email" id="reg-email" placeholder="tu@correo.com">
            </div>
            <div class="input-group">
                <label>FECHA DE NACIMIENTO</label>
                <input type="date" id="reg-date" required>
            </div>
            <div class="input-group">
                <label>CONTRASEÑA</label>
                <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres">
            </div>
            <button class="btn-action" onclick="validarRegistro(event)">CREAR CUENTA PRIVADA</button>
            <p class="switch-text">¿Ya tienes cuenta? <span onclick="toggleAuthMode()">Inicia Sesión</span></p>
        </div>

        <div class="disclaimer">
            Al continuar, confirmas que tienes 18 años o más y aceptas nuestros Términos de Servicio de Contenido Irrestricto.
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
